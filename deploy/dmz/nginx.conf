# Chatbot-DMZ — no TLS, no public hostname yet. Routing is by port, on the
# private address. Add server_name + certificates later without touching
# anything behind this file.
#
#   :80   بیمبا UI        -> App open-webui:8080
#   :8081 chatbot API     -> local bubble-chat-api:8000
#   :8082 SSO passthrough -> the customer's auth endpoint (App has no internet)

upstream openwebui { server APP_IP:8080; }

server {
    listen 80;
    server_name _;

    # A streamed completion is a long request, and it must not be buffered or
    # the UI shows nothing until the model finishes.
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_buffering     off;

    location / {
        proxy_pass http://openwebui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8081;
    server_name _;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://bubble-chat-api:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 8082;
    server_name _;

    # App cannot reach the internet, so DMZ makes the real call on its behalf.
    location / {
        proxy_pass https://SSO_HOST;
        proxy_set_header Host SSO_HOST;
        proxy_ssl_server_name on;
    }
}
