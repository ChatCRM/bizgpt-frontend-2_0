# Chatbot-DB — the entire replacement for Supabase Kong.
# supabase-py calls {SUPABASE_URL}/rest/v1/<table>; PostgREST wants /<table>.
# Plain HTTP on a private address: this listener is reachable only from DMZ.
server {
    listen 8000;
    server_name _;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = / { return 200 "sarmad-db\n"; }
}
